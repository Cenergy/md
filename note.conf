server { 
    listen       80; 
    server_name  note.gishai.top;  
    rewrite ^(.*)$ https://${server_name}$1 permanent; 
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name note.gishai.top;

    charset utf-8;

    # 请确保路径正确
    ssl_certificate /usr/local/nginx/cert/cert.pem;
    ssl_certificate_key /usr/local/nginx/cert/key.pem;
    
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 静态文档服务
    location /doc/ {
        # 注意：请将此路径修改为服务器上实际的项目路径
        # 例如：/www/wwwroot/note.gishai.top/docs/vitepress/
        alias /home/git/md/docs/vitepress/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 代理所有请求到本地 3001 端口
    location / {
        proxy_pass http://127.0.0.1:3001;
        
        # 传递真实 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持 (如果你的应用用了 socket.io 等)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


